base_model: Qwen/Qwen3-14B

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin

strict: false
chat_template: qwen3

datasets:
  - path: /workspace/data/athar/data/train_matcher_v2.jsonl
    ds_type: json
    split: train
    type: chat_template
    field_messages: messages
    roles_to_train: ["assistant"]
    train_on_eos: turn

test_datasets:
  - path: /workspace/data/athar/data/validation_matcher_v2.jsonl
    ds_type: json
    split: train
    type: chat_template
    field_messages: messages
    roles_to_train: ["assistant"]
    train_on_eos: turn

dataset_exact_deduplication: true
dataset_prepared_path: /workspace/data/athar/prepared_matcher_v2
output_dir: /workspace/data/athar/outputs/qwen3-14b-athar-matcher-v2-qlora

sequence_len: 4096
sample_packing: true
eval_sample_packing: false

load_in_4bit: true
adapter: qlora

# Refine the trained matcher checkpoint with new balanced/report-style data.
lora_model_dir: /tmp/athar_training_repo/checkpoints/matcher

lora_r: 16
lora_alpha: 32
lora_dropout: 0.0

lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - down_proj
  - up_proj

lora_mlp_kernel: true
lora_qkv_kernel: true
lora_o_kernel: true

micro_batch_size: 1
gradient_accumulation_steps: 8
num_epochs: 2

optimizer: adamw_torch_4bit
lr_scheduler: cosine
learning_rate: 0.00002
warmup_ratio: 0.1
weight_decay: 0.0

bf16: auto
tf32: true

gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

attn_implementation: flash_attention_2

logging_steps: 1
evals_per_epoch: 2
saves_per_epoch: 1
save_total_limit: 2

seed: 42
